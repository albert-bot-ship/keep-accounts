<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M WALLET — BMW M POWER 財務管理</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══ TOP NAV ══════════════════════════════════════════════ -->
<header class="topnav">
  <button class="menu-toggle" id="menuToggle">☰</button>
  <a class="nav-logo" href="#">
    <div class="nav-logo-badge">M</div>
    <div>
      <div class="nav-logo-text">WALLET</div>
      <span class="nav-logo-sub">BMW M POWER FINANCE</span>
    </div>
  </a>
  <div class="nav-spacer"></div>
  <div class="nav-month" id="navMonth"></div>
  <button class="nav-add-btn" onclick="openModal('addTxn')">＋ 新增消費</button>
</header>

<!-- ══ SIDEBAR ═══════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-label">主選單</div>
  <div class="nav-item active" data-page="dashboard" onclick="nav(this,'dashboard')">
    <span class="nav-icon">📊</span><span>儀表板</span>
  </div>
  <div class="nav-item" data-page="cards" onclick="nav(this,'cards')">
    <span class="nav-icon">💳</span><span>信用卡</span>
  </div>
  <div class="nav-item" data-page="accounts" onclick="nav(this,'accounts')">
    <span class="nav-icon">🏦</span><span>銀行帳戶</span>
  </div>
  <div class="sidebar-label">記帳</div>
  <div class="nav-item" data-page="txns" onclick="nav(this,'txns')">
    <span class="nav-icon">📋</span><span>消費記錄</span>
  </div>
  <div class="nav-item" data-page="fixed" onclick="nav(this,'fixed')">
    <span class="nav-icon">🔁</span><span>固定消費</span>
  </div>
  <div class="sidebar-label">分析</div>
  <div class="nav-item" data-page="analytics" onclick="nav(this,'analytics')">
    <span class="nav-icon">📈</span><span>趨勢分析</span>
  </div>
  <div class="sidebar-label">系統</div>
  <div class="nav-item" data-page="settings" onclick="nav(this,'settings')">
    <span class="nav-icon">⚙️</span><span>設定 / 類別</span>
  </div>
</aside>

<!-- ══ MAIN ══════════════════════════════════════════════════ -->
<div class="app-wrapper">
  <main class="main-content">

    <!-- ─── DASHBOARD ──────────────────────────── -->
    <section class="page-section active" id="page-dashboard">
      <div class="page-header">
        <div class="page-title">儀表板</div>
      </div>
      <div class="stats-grid" id="dashStats"></div>
      <div class="grid-2 mt-4">
        <div>
          <div class="section-div">
            <div class="section-div-line"></div>
            <div class="section-div-label">信用卡總覽</div>
            <div class="section-div-line"></div>
          </div>
          <div id="dashCards"></div>
        </div>
        <div>
          <div class="section-div">
            <div class="section-div-line"></div>
            <div class="section-div-label">銀行帳戶總覽</div>
            <div class="section-div-line"></div>
          </div>
          <div id="dashAccounts"></div>
        </div>
      </div>
      <div class="section-div mt-4">
        <div class="section-div-line"></div>
        <div class="section-div-label">最近消費</div>
        <div class="section-div-line"></div>
      </div>
      <div id="dashRecent"></div>
    </section>

    <!-- ─── CREDIT CARDS ───────────────────────── -->
    <section class="page-section" id="page-cards">
      <div class="page-header">
        <div class="page-title">信用卡</div>
        <button class="btn btn-primary" onclick="openModal('addCard')">＋ 新增信用卡</button>
      </div>
      <div class="stats-grid" id="ccStats"></div>
      <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <!-- ─── BANK ACCOUNTS ──────────────────────── -->
    <section class="page-section" id="page-accounts">
      <div class="page-header">
        <div class="page-title">銀行帳戶</div>
        <button class="btn btn-primary" onclick="openModal('addAccount')">＋ 新增帳戶</button>
      </div>
      <div class="cards-grid" id="accountsGrid"></div>
    </section>

    <!-- ─── TRANSACTIONS ───────────────────────── -->
    <section class="page-section" id="page-txns">
      <div class="page-header">
        <div class="page-title">消費記錄</div>
        <button class="btn btn-primary" onclick="openModal('addTxn')">＋ 新增記錄</button>
      </div>
      <div class="table-container">
        <div class="table-toolbar">
          <input type="date" class="form-input" id="filterFrom" style="width:140px">
          <span style="color:var(--tx-muted)">—</span>
          <input type="date" class="form-input" id="filterTo" style="width:140px">
          <select class="form-select" id="filterSource" style="width:155px" onchange="renderTxns()">
            <option value="">全部帳戶/卡片</option>
          </select>
          <select class="form-select" id="filterCat" style="width:120px" onchange="renderTxns()">
            <option value="">全部類別</option>
          </select>
          <select class="form-select" id="filterType" style="width:100px" onchange="renderTxns()">
            <option value="">全部</option>
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="renderTxns()">🔍 篩選</button>
          <div class="table-toolbar-right">
            <button class="btn btn-success btn-sm" onclick="exportExcel()">📥 匯出 Excel</button>
          </div>
        </div>
        <div id="txnTableWrap"></div>
      </div>
    </section>

    <!-- ─── FIXED EXPENSES ─────────────────────── -->
    <section class="page-section" id="page-fixed">
      <div class="page-header">
        <div class="page-title">固定消費</div>
        <button class="btn btn-primary" onclick="openModal('addFixed')">＋ 新增固定消費</button>
      </div>
      <p style="color:var(--tx-secondary);font-size:12px;margin-bottom:16px">每月依照設定日期自動加入消費記錄（當日或已過當日才生成）。</p>
      <div id="fixedList"></div>
    </section>

    <!-- ─── ANALYTICS ──────────────────────────── -->
    <section class="page-section" id="page-analytics">
      <div class="page-header">
        <div class="page-title">趨勢分析</div>
        <select class="form-select" id="analyticsYear" style="width:110px" onchange="renderAnalytics()"></select>
      </div>
      <div class="stats-grid" id="analyticsStats"></div>
      <div class="charts-grid-2">
        <div class="chart-box">
          <div class="chart-title">月度消費趨勢</div>
          <canvas id="trendChart" height="200"></canvas>
        </div>
        <div class="chart-box">
          <div class="chart-title">本月類別分布</div>
          <canvas id="catChart" height="200"></canvas>
        </div>
      </div>
      <div class="chart-box mt-4">
        <div class="chart-title">各類別年度累計</div>
        <canvas id="catBarChart" height="120"></canvas>
      </div>
    </section>

    <!-- ─── SETTINGS ───────────────────────────── -->
    <section class="page-section" id="page-settings">
      <div class="page-header">
        <div class="page-title">設定 / 類別</div>
        <button class="btn btn-primary" onclick="openModal('addCat')">＋ 新增類別</button>
      </div>
      <p style="color:var(--tx-secondary);font-size:12px;margin-bottom:16px">設定消費類別與月度預算額度，超過額度時記錄會以紅色警示閃爍顯示。</p>
      <div id="catList"></div>
      <div class="section-div mt-4">
        <div class="section-div-line"></div>
        <div class="section-div-label">資料管理</div>
        <div class="section-div-line"></div>
      </div>
      <div class="flex gap-3 mt-3" style="flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="exportData()">📤 匯出備份 (.json)</button>
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">📥 匯入備份</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-danger" onclick="confirmClearAll()">🗑 清除所有資料</button>
      </div>
    </section>

  </main>
</div>

<!-- ══ MODAL ═════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOverlay(event)">
  <div class="modal" id="modalBox" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ══ TOAST ══════════════════════════════════════════════════ -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ══════════════════════════════════════════════════════════ -->
<script>
// ─── STORAGE KEY ──────────────────────────────────────────────
const SK = 'mwallet_v2';
let DB = loadDB();
let charts = {};
let modalType = null, editTarget = null;

// ─── DEFAULT DB ───────────────────────────────────────────────
function defaultDB() {
  return {
    creditCards: [],
    bankAccounts: [],
    transactions: [],
    fixedExpenses: [],
    generatedFixed: {},     // { 'YYYY-MM': [fixedId,...] }
    categories: [
      { id: uid(), name: '餐飲',   color: '#e31836', budget: 0 },
      { id: uid(), name: '交通',   color: '#1c69d4', budget: 0 },
      { id: uid(), name: '購物',   color: '#9b59b6', budget: 0 },
      { id: uid(), name: '娛樂',   color: '#f39c12', budget: 0 },
      { id: uid(), name: '醫療',   color: '#27ae60', budget: 0 },
      { id: uid(), name: '訂閱',   color: '#00bcd4', budget: 0 },
      { id: uid(), name: '其他',   color: '#7f8c8d', budget: 0 },
    ]
  };
}

// ─── PERSISTENCE ─────────────────────────────────────────────
function loadDB() {
  try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); } catch {}
  return defaultDB();
}
function saveDB() { localStorage.setItem(SK, JSON.stringify(DB)); }

// ─── UTILITIES ───────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n) { return 'NT$' + Math.abs(Math.round(n)).toLocaleString('zh-TW'); }
function today() { return new Date().toISOString().slice(0,10); }
function nowYM() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function ym(d) { return (d||'').slice(0,7); }
function getCat(id) { return DB.categories.find(c => c.id === id) || { name:'—', color:'#7f8c8d', budget: 0 }; }
function getCard(id) { return DB.creditCards.find(c => c.id === id); }
function getAcc(id) { return DB.bankAccounts.find(a => a.id === id); }

// ─── COMPUTED ─────────────────────────────────────────────────
function cardBalance(cardId) {
  return DB.transactions
    .filter(t => t.sourceType === 'card' && t.sourceId === cardId)
    .reduce((s, t) => s + t.amount, 0);
}

function accountBalance(accId) {
  const acc = getAcc(accId);
  if (!acc) return 0;
  const layers = (acc.layers || []).reduce((s, l) => s + (l.amount || 0), 0);
  const txns   = DB.transactions
    .filter(t => t.sourceType === 'account' && t.sourceId === accId)
    .reduce((s, t) => s + t.amount, 0);
  return layers + txns;
}

function thisMonthCCSpend() {
  const cur = nowYM();
  return DB.transactions
    .filter(t => t.sourceType === 'card' && t.amount < 0 && ym(t.date) === cur)
    .reduce((s, t) => s + t.amount, 0);
}

function catMonthSpend(catId) {
  const cur = nowYM();
  return DB.transactions
    .filter(t => t.category === catId && t.amount < 0 && ym(t.date) === cur)
    .reduce((s, t) => s + Math.abs(t.amount), 0);
}

function sourceName(t) {
  if (t.sourceType === 'card')    { const c = getCard(t.sourceId); return c ? c.name : '已刪除'; }
  if (t.sourceType === 'account') { const a = getAcc(t.sourceId);  return a ? a.name : '已刪除'; }
  return '—';
}

// ─── FIXED EXPENSE AUTO-GENERATE ────────────────────────────
function generateFixed() {
  const now    = new Date();
  const curYM  = nowYM();
  const curDay = now.getDate();
  if (!DB.generatedFixed[curYM]) DB.generatedFixed[curYM] = [];
  let added = 0;
  DB.fixedExpenses.forEach(fe => {
    if (DB.generatedFixed[curYM].includes(fe.id)) return;
    if (curDay < fe.day) return;
    const d = String(Math.min(fe.day, 28)).padStart(2,'0');
    DB.transactions.push({
      id: uid(),
      date: curYM + '-' + d,
      amount: -Math.abs(fe.amount),
      desc: fe.desc + '（固定）',
      category: fe.category,
      sourceId: fe.sourceId,
      sourceType: fe.sourceType,
      notes: fe.notes || '',
      isFixed: true,
      fixedId: fe.id
    });
    DB.generatedFixed[curYM].push(fe.id);
    added++;
  });
  if (added) { saveDB(); toast('已自動新增 ' + added + ' 筆固定消費', 'info'); }
}

// ─── NAVIGATION ───────────────────────────────────────────────
function nav(el, page) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  renderPage(page);
}

function renderPage(page) {
  const fn = { dashboard: renderDashboard, cards: renderCards, accounts: renderAccounts, txns: renderTxns, fixed: renderFixed, analytics: renderAnalytics, settings: renderSettings };
  if (fn[page]) fn[page]();
}

// ══ DASHBOARD ═════════════════════════════════════════════════
function renderDashboard() {
  const ccSpend   = Math.abs(thisMonthCCSpend());
  const totalDebt = DB.creditCards.reduce((s, c) => { const b = cardBalance(c.id); return s + (b < 0 ? Math.abs(b) : 0); }, 0);
  const totalBank = DB.bankAccounts.reduce((s, a) => s + accountBalance(a.id), 0);

  // Find any salary layer sum across all accounts
  const salarySum = DB.bankAccounts.reduce((s, a) => {
    const l = (a.layers||[]).find(l => l.label.includes('薪'));
    return s + (l ? l.amount : 0);
  }, 0);
  const remaining = salarySum - ccSpend;

  document.getElementById('dashStats').innerHTML =
    statCard('本月信用卡消費', fmt(-ccSpend), ccSpend > 0 ? 'danger' : '', '本月所有信用卡消費加總', '💳') +
    statCard('信用卡未償還', fmt(-totalDebt), totalDebt > 0 ? 'danger' : 'success', '所有卡片累積負債', '🔴') +
    statCard('銀行總資產', fmt(totalBank), 'blue', '所有帳戶餘額合計', '🏦') +
    statCard('本月剩餘生活費', fmt(remaining), remaining < 0 ? 'danger' : remaining < salarySum * 0.2 ? 'warning' : 'success', '薪水分層 − 本月信用卡消費', '💰');

  // CC mini-list
  let ccHtml = DB.creditCards.map(c => {
    const bal = cardBalance(c.id);
    return `<div class="layer-bar" style="border-left:3px solid ${c.color}">
      <div style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0"></div>
      <span style="flex:1;font-size:13px">${c.name}</span>
      <span class="layer-amt ${bal < 0 ? 'a-neg' : 'a-pos'}">${bal < 0 ? '−' : '+'}${fmt(Math.abs(bal))}</span>
    </div>`;
  }).join('');
  document.getElementById('dashCards').innerHTML = ccHtml || emptyState('💳','尚無信用卡');

  // Account mini-list
  let accHtml = DB.bankAccounts.map(a => {
    const bal = accountBalance(a.id);
    return `<div class="layer-bar" style="border-left:3px solid ${a.color}">
      <div style="width:8px;height:8px;border-radius:50%;background:${a.color};flex-shrink:0"></div>
      <span style="flex:1;font-size:13px">${a.name}</span>
      <span class="layer-amt ${bal < 0 ? 'a-neg' : 'a-pos'}">${fmt(bal)}</span>
    </div>`;
  }).join('');
  document.getElementById('dashAccounts').innerHTML = accHtml || emptyState('🏦','尚無銀行帳戶');

  // Recent txns
  const recent = [...DB.transactions].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 8);
  document.getElementById('dashRecent').innerHTML = txnTable(recent, false);
}

function statCard(label, val, cls, sub, icon) {
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-value ${cls}">${val}</div>
    <div class="stat-sub">${sub}</div>
    <div class="stat-icon">${icon}</div>
  </div>`;
}

// ══ CREDIT CARDS ══════════════════════════════════════════════
function renderCards() {
  const monthSpend = Math.abs(thisMonthCCSpend());
  const totalDebt  = DB.creditCards.reduce((s,c) => { const b=cardBalance(c.id); return s+(b<0?Math.abs(b):0); },0);

  document.getElementById('ccStats').innerHTML =
    statCard('本月信用卡總消費', fmt(-monthSpend), monthSpend>0?'danger':'', '本月所有卡片支出', '📊') +
    statCard('未償還總額', fmt(-totalDebt), totalDebt>0?'danger':'success', '全卡片累積負債', '💳') +
    statCard('持卡數量', DB.creditCards.length, 'blue', '', '🃏');

  let html = DB.creditCards.map(c => {
    const bal = cardBalance(c.id);
    const isNeg = bal < 0;
    const used = c.limit > 0 ? Math.min(100, Math.abs(bal)/c.limit*100) : 0;
    const icon = c.icon ? `<img src="${c.icon}" alt="">` : '💳';
    const mSpend = DB.transactions
      .filter(t => t.sourceType==='card' && t.sourceId===c.id && t.amount<0 && ym(t.date)===nowYM())
      .reduce((s,t)=>s+Math.abs(t.amount),0);
    const barColor = used>80?'var(--m-red)':used>50?'var(--warn)':'var(--m-blue)';
    return `<div class="account-card">
      <div class="account-card-header" style="border-top:3px solid ${c.color}">
        <div class="account-card-icon" style="background:${c.color}22">${icon}</div>
        <div style="flex:1">
          <div class="account-card-name">${c.name}</div>
          <div class="account-card-type">CREDIT CARD${c.limit?'　額度 '+fmt(c.limit):''}</div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editCard','${c.id}')">✏️</button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="deleteCard('${c.id}')">🗑</button>
        </div>
      </div>
      <div class="account-card-body">
        <div style="font-size:11px;color:var(--tx-muted);margin-bottom:4px">當前餘額</div>
        <div class="account-balance ${isNeg?'negative':'positive'}">${isNeg?'−':'+'}${fmt(Math.abs(bal))}</div>
        <div style="font-size:11px;color:var(--tx-secondary);margin-top:6px">本月消費：${fmt(-mSpend)}</div>
        ${c.limit>0?`<div class="prog-wrap mt-2"><div class="prog-bar" style="width:${used}%;background:${barColor}"></div></div><div style="font-size:10px;color:var(--tx-muted);margin-top:3px">已用 ${used.toFixed(0)}%</div>`:''}
      </div>
      <div class="account-card-footer">
        <button class="btn btn-sm btn-primary" onclick="openModal('payment','${c.id}')">💸 繳款</button>
        <button class="btn btn-sm btn-ghost"   onclick="openModal('addTxn',null,'${c.id}')">＋ 消費</button>
        <button class="btn btn-sm btn-ghost"   onclick="filterByCard('${c.id}')">📋 明細</button>
      </div>
    </div>`;
  }).join('');
  html += `<div class="add-card-btn" onclick="openModal('addCard')"><div class="add-card-icon">＋</div><div class="add-card-label">新增信用卡</div></div>`;
  document.getElementById('cardsGrid').innerHTML = html;
}

function deleteCard(id) {
  if (!confirm('確定刪除此信用卡？相關消費記錄也會一併刪除。')) return;
  DB.creditCards  = DB.creditCards.filter(c => c.id !== id);
  DB.transactions = DB.transactions.filter(t => !(t.sourceType==='card' && t.sourceId===id));
  saveDB(); renderCards(); toast('信用卡已刪除','danger');
}

function filterByCard(cardId) {
  const el = document.querySelector('[data-page="txns"]');
  nav(el, 'txns');
  setTimeout(() => {
    document.getElementById('filterSource').value = 'card_' + cardId;
    renderTxns();
  }, 60);
}

// ══ BANK ACCOUNTS ═════════════════════════════════════════════
function renderAccounts() {
  const ccSpend = Math.abs(thisMonthCCSpend());
  let html = DB.bankAccounts.map(a => {
    const bal  = accountBalance(a.id);
    const icon = a.icon ? `<img src="${a.icon}" alt="">` : '🏦';
    const salaryLayer = (a.layers||[]).find(l => l.label.includes('薪'));
    const salaryAmt = salaryLayer ? salaryLayer.amount : null;

    const layersHtml = (a.layers||[]).map(l => `
      <div class="layer-bar">
        <div class="layer-dot" style="background:${l.color||a.color}"></div>
        <span class="layer-name">${l.label}</span>
        <span class="layer-amt">${fmt(l.amount)}</span>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editLayer','${a.id}',null,null,'${l.id}')">✏️</button>
        <button class="btn btn-danger btn-icon btn-sm" onclick="delLayer('${a.id}','${l.id}')">✕</button>
      </div>`).join('');

    return `<div class="account-card">

function delLayer(accId, layerId) {

function deleteAccount(id) {

// ══ TRANSACTIONS ══════════════════════════════════════════════
function renderTxns() {
  // Populate source filter
  const srcSel = document.getElementById('filterSource');
  const oldSrc = srcSel.value;
  srcSel.innerHTML = '<option value="">全部帳戶/卡片</option>';
  DB.creditCards.forEach(c  => { srcSel.innerHTML += `<option value="card_${c.id}">[卡] ${c.name}</option>`; });
  DB.bankAccounts.forEach(a => { srcSel.innerHTML += `<option value="account_${a.id}">[帳] ${a.name}</option>`; });
  srcSel.value = oldSrc;

  // Populate category filter
  const catSel = document.getElementById('filterCat');
  const oldCat = catSel.value;
  catSel.innerHTML = '<option value="">全部類別</option>';
  DB.categories.forEach(c => { catSel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
  catSel.value = oldCat;

  const from     = document.getElementById('filterFrom').value;
  const to       = document.getElementById('filterTo').value;
  const srcVal   = srcSel.value;
  const catVal   = catSel.value;
  const typeVal  = document.getElementById('filterType').value;

  let txns = [...DB.transactions].sort((a,b) => b.date.localeCompare(a.date));
  if (from)    txns = txns.filter(t => t.date >= from);
  if (to)      txns = txns.filter(t => t.date <= to);
  if (srcVal)  { const [tp,sid] = srcVal.split('_'); txns = txns.filter(t => t.sourceType===tp && t.sourceId===sid); }
  if (catVal)  txns = txns.filter(t => t.category === catVal);
  if (typeVal === 'expense') txns = txns.filter(t => t.amount < 0);
  if (typeVal === 'income')  txns = txns.filter(t => t.amount > 0);

  document.getElementById('txnTableWrap').innerHTML = txnTable(txns, true);
}

function txnTable(txns, withActions) {
  if (!txns.length) return emptyState('📋','無消費記錄','點擊「新增記錄」開始記帳');
  const rows = txns.map(t => {
    const cat      = getCat(t.category);
    const spent    = cat.budget > 0 ? catMonthSpend(t.category) : 0;
    const isOver   = cat.budget > 0 && spent > cat.budget && t.amount < 0;
    const amtCls   = t.amount > 0 ? 'a-pos' : isOver ? 'a-over' : 'a-neg';
    const sign     = t.amount > 0 ? '+' : '−';
    const tags     = (t.isFixed?'<span class="badge badge-violet" style="margin-left:4px">固定</span>':'') +
                     (t.isPayment?'<span class="badge badge-green" style="margin-left:4px">繳款</span>':'') +
                     (t.isTransfer?'<span class="badge badge-blue" style="margin-left:4px">轉帳</span>':'');
    const actions  = withActions ? `<td style="white-space:nowrap">
      <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editTxn','${t.id}')">✏️</button>
      <button class="btn btn-danger btn-icon btn-sm" onclick="deleteTxn('${t.id}')">🗑</button>
    </td>` : '';
    return `<tr>
      <td style="white-space:nowrap">${t.date}</td>
      <td>${escHtml(t.desc)}${tags}</td>
      <td><span class="badge" style="background:${cat.color}22;color:${cat.color};border:1px solid ${cat.color}55">${cat.name}</span></td>
      <td style="white-space:nowrap">${sourceName(t)}</td>
      <td class="${amtCls}" style="white-space:nowrap">${sign}${fmt(Math.abs(t.amount))}</td>
      <td style="color:var(--tx-secondary);font-size:12px">${escHtml(t.notes||'—')}</td>
      ${actions}
    </tr>`;
  }).join('');
  const total = txns.reduce((s,t) => s + t.amount, 0);
  const span  = withActions ? 6 : 5;
  return `<table>
    <thead><tr>
      <th>日期</th><th>內容</th><th>類別</th><th>帳戶/卡片</th><th>金額</th><th>備註</th>
      ${withActions?'<th>操作</th>':''}
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:var(--bg-secondary)">
      <td colspan="${span}" style="padding:10px 14px;font-size:11px;color:var(--tx-muted)">共 ${txns.length} 筆</td>
      <td style="padding:10px 14px;font-weight:700;font-family:var(--ff-display);font-size:15px;color:${total<0?'var(--tx-red)':'var(--tx-green)'}">${total>=0?'+':'−'}${fmt(Math.abs(total))}</td>
      ${withActions?'<td></td>':''}
    </tr></tfoot>
  </table>`;
}

function deleteTxn(id) {
  if (!confirm('確定刪除此記錄？')) return;
  DB.transactions = DB.transactions.filter(t => t.id !== id);
  saveDB(); renderTxns(); toast('記錄已刪除','danger');
}

function exportExcel() {
  const from  = document.getElementById('filterFrom').value;
  const to    = document.getElementById('filterTo').value;
  let txns = [...DB.transactions].sort((a,b) => a.date.localeCompare(b.date));
  if (from) txns = txns.filter(t => t.date >= from);
  if (to)   txns = txns.filter(t => t.date <= to);
  const data = txns.map(t => ({
    '日期': t.date, '內容': t.desc, '類別': getCat(t.category).name,
    '帳戶/卡片': sourceName(t), '金額': t.amount, '備註': t.notes || ''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '消費明細');
  XLSX.writeFile(wb, 'MWallet_' + (from||'all') + '_' + (to||'all') + '.xlsx');
  toast('Excel 匯出成功！','success');
}

// ══ ANALYTICS ════════════════════════════════════════════════
function renderAnalytics() {
  const yearSel = document.getElementById('analyticsYear');
  if (!yearSel.options.length) {
    const cur = new Date().getFullYear();
    const years = new Set(DB.transactions.map(t => t.date.slice(0,4)));
    [String(cur-1), String(cur), String(cur+1)].forEach(y => years.add(y));
    [...years].sort().forEach(y => {
      const o = document.createElement('option');
      o.value = y; o.textContent = y + ' 年';
      if (y === String(cur)) o.selected = true;
      yearSel.appendChild(o);
    });
  }
  const year = yearSel.value || String(new Date().getFullYear());

  // Stats
  const yearTxns  = DB.transactions.filter(t => t.date.startsWith(year));
  const yearSpend = Math.abs(yearTxns.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0));
  const yearInc   = yearTxns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const avgMonthly = yearSpend / 12;
  const maxCat    = DB.categories.reduce((best, c) => {
    const v = Math.abs(yearTxns.filter(t=>t.category===c.id&&t.amount<0).reduce((s,t)=>s+t.amount,0));
    return v > (best.v||0) ? {name:c.name,v} : best;
  }, {});

  document.getElementById('analyticsStats').innerHTML =
    statCard(year+' 年度總支出', fmt(-yearSpend), yearSpend>0?'danger':'', '', '📉') +
    statCard(year+' 年度總收入', fmt(yearInc), yearInc>0?'success':'', '', '📈') +
    statCard('月均消費', fmt(-avgMonthly), 'warning', '', '📊') +
    statCard('最大消費類別', maxCat.name||'—', 'blue', maxCat.v?fmt(-maxCat.v):'', '🏷');

  // Monthly trend
  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const mLabels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const mSpend  = months.map(m => Math.abs(DB.transactions.filter(t=>t.date.startsWith(year+'-'+m)&&t.amount<0).reduce((s,t)=>s+t.amount,0)));
  const mInc    = months.map(m => DB.transactions.filter(t=>t.date.startsWith(year+'-'+m)&&t.amount>0).reduce((s,t)=>s+t.amount,0));

  if (charts.trend) charts.trend.destroy();
  charts.trend = new Chart(document.getElementById('trendChart').getContext('2d'), {
    type: 'line',
    data: { labels: mLabels, datasets: [
      { label:'支出', data:mSpend, borderColor:'#C8102E', backgroundColor:'rgba(200,16,46,0.1)', tension:.4, fill:true, pointBackgroundColor:'#C8102E', pointRadius:4 },
      { label:'收入', data:mInc,   borderColor:'#00C853', backgroundColor:'rgba(0,200,83,0.1)',   tension:.4, fill:true, pointBackgroundColor:'#00C853', pointRadius:4 }
    ]},
    options: { responsive:true, plugins:{ legend:{ labels:{ color:'#8080A8' } } }, scales:{ x:{ ticks:{ color:'#8080A8' }, grid:{ color:'rgba(255,255,255,0.04)' } }, y:{ ticks:{ color:'#8080A8', callback:v=>'NT$'+v.toLocaleString() }, grid:{ color:'rgba(255,255,255,0.04)' } } } }
  });

  // Category doughnut (current month)
  const catSpends = DB.categories.map(c => catMonthSpend(c.id));
  if (charts.cat) charts.cat.destroy();
  charts.cat = new Chart(document.getElementById('catChart').getContext('2d'), {
    type: 'doughnut',
    data: { labels: DB.categories.map(c=>c.name), datasets: [{ data:catSpends, backgroundColor:DB.categories.map(c=>c.color), borderWidth:2, borderColor:'#1A1A2E' }] },
    options: { responsive:true, plugins:{ legend:{ labels:{ color:'#8080A8', font:{size:11} }, position:'bottom' } } }
  });

  // Category bar (year)
  const catYear = DB.categories.map(c => Math.abs(DB.transactions.filter(t=>t.category===c.id&&t.date.startsWith(year)&&t.amount<0).reduce((s,t)=>s+t.amount,0)));
  if (charts.catBar) charts.catBar.destroy();
  charts.catBar = new Chart(document.getElementById('catBarChart').getContext('2d'), {
    type: 'bar',
    data: { labels: DB.categories.map(c=>c.name), datasets: [{ label:'年度支出', data:catYear, backgroundColor:DB.categories.map(c=>c.color+'cc'), borderRadius:5 }] },
    options: { responsive:true, plugins:{ legend:{ labels:{ color:'#8080A8' } } }, scales:{ x:{ ticks:{ color:'#8080A8' }, grid:{ display:false } }, y:{ ticks:{ color:'#8080A8', callback:v=>'NT$'+v.toLocaleString() }, grid:{ color:'rgba(255,255,255,0.04)' } } } }
  });
}

function renderSettings() {
  let html = DB.categories.length ? DB.categories.map(c => {
    const spent  = catMonthSpend(c.id);
    const isOver = c.budget > 0 && spent > c.budget;
    const pct    = c.budget > 0 ? Math.min(100, spent/c.budget*100) : 0;
    return `<div class="fe-item">
      <div style="width:14px;height:14px;border-radius:50%;background:${c.color};flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${escHtml(c.name)}</div>
        ${c.budget>0?`<div class="prog-wrap mt-2" style="max-width:200px"><div class="prog-bar" style="width:${pct}%;background:${isOver?'var(--m-red)':'var(--m-blue)'}"></div></div>`:''}
      </div>
      <span style="font-size:12px;color:var(--tx-secondary)">本月：${fmt(-spent)}</span>
      ${c.budget>0?`<span class="badge ${isOver?'badge-red':'badge-green'}">${isOver?'⚠ 超支':'正常'}　額度${fmt(-c.budget)}</span>`:'<span class="badge badge-gray">無額度</span>'}
      <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editCat','${c.id}')">✏️</button>
      <button class="btn btn-danger btn-icon btn-sm" onclick="deleteCat('${c.id}')">🗑</button>
    </div>`;
  }).join('') : emptyState('🏷','尚無類別');
  document.getElementById('catList').innerHTML = html;
}

const SWATCHES = ['#C8102E','#0057B8','#6F2CA7','#00C853','#FF8F00','#00BCD4','#FF4081','#e67e22','#1abc9c','#795548','#607D8B','#E91E63','#ff6b35','#2ecc71'];

function colorPicker(fid, cur) {
  cur = cur || '#0057B8';
  const swatches = SWATCHES.map(c =>
    `<div class="c-swatch${cur===c?' sel':''}" style="background:${c}" title="${c}" onclick="selectColor('${fid}','${c}',this)"></div>`
  ).join('');
  return `<div class="color-picker-row" id="cpRow_${fid}">
    ${swatches}
    <div class="c-custom" title="自訂顏色">＋
      <input type="color" value="${cur}" oninput="selectColor('${fid}',this.value,null)">
    </div>
    <input type="hidden" id="${fid}" value="${cur}">
    <div class="color-preview" id="cpPrev_${fid}" style="background:${cur}"></div>
  </div>`;
}

function selectColor(fid, color, swatchEl) {
  const inp = document.getElementById(fid);
  if (inp) inp.value = color;
  const prev = document.getElementById('cpPrev_' + fid);
  if (prev) prev.style.background = color;
  const row = document.getElementById('cpRow_' + fid);
  if (row) row.querySelectorAll('.c-swatch').forEach(s => s.classList.remove('sel'));
  if (swatchEl) swatchEl.classList.add('sel');
}

function iconUpload(fid, cur) {
  cur = cur || '';
  return `<div>
    <div class="icon-upload" id="${fid}_box" onclick="document.getElementById('${fid}_inp').click()" style="cursor:pointer">
      ${cur ? `<img src="${cur}" id="${fid}_img" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : `<span id="${fid}_img" style="font-size:22px">🖼</span>`}
      <input type="file" id="${fid}_inp" accept="image/*" style="display:none" onchange="loadIcon('${fid}',this)">
    </div>
    <div class="icon-hint" style="text-align:center;font-size:9px;color:var(--tx-muted);margin-top:4px">點擊上傳圖示</div>
    <input type="hidden" id="${fid}" value="${cur}">
  </div>`;
}

function loadIcon(fid, input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById(fid).value = e.target.result;
    const el = document.getElementById(fid + '_img');
    if (el && el.tagName === 'SPAN') {
      const img = document.createElement('img');
      img.id = fid + '_img';
      img.src = e.target.result;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:inherit';
      el.replaceWith(img);
    } else if (el) { el.src = e.target.result; }
  };
  r.readAsDataURL(file);
}

function srcOpts(type) {
  let o = '';
  if (type !== 'account') DB.creditCards.forEach(c => { o += `<option value="card_${c.id}">[卡] ${escAttr(c.name)}</option>`; });
  if (type !== 'card')    DB.bankAccounts.forEach(a => { o += `<option value="account_${a.id}">[帳] ${escAttr(a.name)}</option>`; });
  return o;
}

function catOpts(selId) {

}

function openModal(type, id, preCard, preAcc, extraId) {
  modalType = type; editTarget = id || null;
  const overlay = document.getElementById('modalOverlay');
  const box     = document.getElementById('modalBox');
  box.className = 'modal';

  let t='', b='', f='';
  const c = id && type.startsWith('editCard')    ? getCard(id)     : null;
  const a = id && type.startsWith('editAccount') ? getAcc(id)      : null;
  const txn = id && type==='editTxn'             ? DB.transactions.find(x=>x.id===id) : null;
  const fe  = id && type==='editFixed'           ? DB.fixedExpenses.find(x=>x.id===id): null;
  const cat = id && type==='editCat'             ? DB.categories.find(x=>x.id===id)   : null;
  const accForLayer = (type==='addLayer'||type==='editLayer') ? getAcc(id) : null;
  const layer = type==='editLayer' && accForLayer ? accForLayer.layers.find(l=>l.id===extraId) : null;

  // ── ADD / EDIT CARD ──
  if (type==='addCard'||type==='editCard') {
    t = c ? '編輯信用卡' : '新增信用卡';
    b = `<div style="display:flex;gap:14px;align-items:flex-start">
      ${iconUpload('cIcon', c?.icon||'')}
      <div style="flex:1">
        <div class="form-group"><label class="form-label">卡片名稱</label><input class="form-input" id="cName" value="${escAttr(c?.name||'')}" placeholder="e.g. 玉山現金回饋卡"></div>
        <div class="form-group"><label class="form-label">信用額度（選填，0=不設限）</label><input class="form-input" id="cLimit" type="number" value="${c?.limit||0}"></div>
      </div>
    </div>
    <div class="form-group mt-3"><label class="form-label">代表顏色</label>${colorPicker('cColor', c?.color||'#C8102E')}</div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCard()">儲存</button>`;
  }

  // ── ADD / EDIT ACCOUNT ──
  else if (type==='addAccount'||type==='editAccount') {
    t = a ? '編輯銀行帳戶' : '新增銀行帳戶';
    b = `<div style="display:flex;gap:14px;align-items:flex-start">
      ${iconUpload('aIcon', a?.icon||'')}
      <div style="flex:1">
        <div class="form-group"><label class="form-label">帳戶名稱</label><input class="form-input" id="aName" value="${escAttr(a?.name||'')}" placeholder="e.g. 台新薪轉帳戶"></div>
      </div>
    </div>
    <div class="form-group mt-3"><label class="form-label">代表顏色</label>${colorPicker('aColor', a?.color||'#0057B8')}</div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAccount()">儲存</button>`;
  }

  // ── ADD / EDIT LAYER ──
  else if (type==='addLayer'||type==='editLayer') {
    t = layer ? '編輯資金分層' : '新增資金分層';
    b = `<input type="hidden" id="lAccId" value="${id}">
    <input type="hidden" id="lLayId" value="${extraId||''}">
    <div class="form-group"><label class="form-label">分層名稱</label><input class="form-input" id="lLabel" value="${escAttr(layer?.label||'')}" placeholder="e.g. 薪水、獎金、緊急備用金"></div>
    <div class="form-group"><label class="form-label">金額（NT$）</label><input class="form-input" id="lAmt" type="number" value="${layer?.amount||0}"></div>
    <div class="form-group"><label class="form-label">顏色</label>${colorPicker('lColor', layer?.color||accForLayer?.color||'#0057B8')}</div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveLayer()">儲存</button>`;
  }

  // ── ADD / EDIT TRANSACTION ──
  else if (type==='addTxn'||type==='editTxn') {
    t = txn ? '編輯消費記錄' : '新增消費記錄';
    const isInc = txn && txn.amount > 0;
    const preSrc = preCard ? 'card_'+preCard : preAcc ? 'account_'+preAcc : txn ? txn.sourceType+'_'+txn.sourceId : '';
    b = `<div class="form-row">
      <div class="form-group"><label class="form-label">日期</label><input class="form-input" id="tDate" type="date" value="${txn?.date||today()}"></div>
      <div class="form-group"><label class="form-label">類型</label>
        <select class="form-select" id="tType">
          <option value="expense"${!isInc?' selected':''}>支出</option>
          <option value="income"${isInc?' selected':''}>收入</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">金額（NT$）</label><input class="form-input" id="tAmt" type="number" value="${txn?Math.abs(txn.amount):''}" placeholder="0"></div>
      <div class="form-group"><label class="form-label">類別</label><select class="form-select" id="tCat">${catOpts(txn?.category||DB.categories[0]?.id||'')}</select></div>
    </div>
    <div class="form-group"><label class="form-label">消費內容</label><input class="form-input" id="tDesc" value="${escAttr(txn?.desc||'')}" placeholder="e.g. 全聯購物"></div>
    <div class="form-group"><label class="form-label">帳戶 / 卡片</label>
      <select class="form-select" id="tSrc"><option value="">請選擇</option>${srcOpts('both')}</select>
    </div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="tNotes" value="${escAttr(txn?.notes||'')}" placeholder=""></div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTxn()">儲存</button>`;
    setTimeout(() => { const el=document.getElementById('tSrc'); if(el&&preSrc) el.value=preSrc; }, 60);
  }

  // ── PAYMENT ──
  else if (type==='payment') {
    const card = getCard(id);
    const bal  = cardBalance(id);
    t = '信用卡繳款 — ' + (card?.name||'');
    b = `<input type="hidden" id="pyCardId" value="${id}">
    <div style="background:var(--err-bg);border:1px solid var(--bdr-red);border-radius:var(--r);padding:14px;margin-bottom:16px">
      <div style="font-size:11px;color:var(--tx-muted);margin-bottom:4px">目前欠款</div>
      <div style="font-family:var(--ff-display);font-size:24px;font-weight:700;color:var(--tx-red)">−${fmt(Math.abs(bal))}</div>
    </div>
    <div class="form-group"><label class="form-label">繳款金額（NT$）</label><input class="form-input" id="pyAmt" type="number" value="${Math.abs(bal)}" placeholder="0"></div>
    <div class="form-group"><label class="form-label">從哪個帳戶扣款</label>
      <select class="form-select" id="pyFrom"><option value="">請選擇帳戶</option>${srcOpts('account')}</select>
    </div>
    <div class="form-group"><label class="form-label">繳款日期</label><input class="form-input" id="pyDate" type="date" value="${today()}"></div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="pyNotes" placeholder=""></div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-success" onclick="doPayment()">✅ 確認繳款</button>`;
  }

  // ── TRANSFER ──
  else if (type==='transfer') {
    t = '帳戶轉帳';
    const accOpts = DB.bankAccounts.map(a => `<option value="${a.id}"${a.id===id?' selected':''}>${escAttr(a.name)}</option>`).join('');
    b = `<div class="form-group"><label class="form-label">從帳戶</label><select class="form-select" id="tfFrom">${accOpts}</select></div>
    <div class="form-group"><label class="form-label">到帳戶</label><select class="form-select" id="tfTo">${accOpts}</select></div>
    <div class="form-group"><label class="form-label">轉帳金額（NT$）</label><input class="form-input" id="tfAmt" type="number" placeholder="0"></div>
    <div class="form-group"><label class="form-label">日期</label><input class="form-input" id="tfDate" type="date" value="${today()}"></div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="tfNotes" placeholder=""></div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-violet" onclick="doTransfer()">🔄 確認轉帳</button>`;
  }

  // ── ADD / EDIT FIXED ──
  else if (type==='addFixed'||type==='editFixed') {
    t = fe ? '編輯固定消費' : '新增固定消費';
    const preFeSrc = fe ? fe.sourceType+'_'+fe.sourceId : '';
    b = `<div class="form-row">
      <div class="form-group"><label class="form-label">每月幾號</label><input class="form-input" id="feDay" type="number" min="1" max="28" value="${fe?.day||1}"></div>
      <div class="form-group"><label class="form-label">金額（NT$）</label><input class="form-input" id="feAmt" type="number" value="${fe?.amount||0}" placeholder="0"></div>
    </div>
    <div class="form-group"><label class="form-label">消費內容</label><input class="form-input" id="feDesc" value="${escAttr(fe?.desc||'')}" placeholder="e.g. Netflix、健身房月費"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">類別</label><select class="form-select" id="feCat">${catOpts(fe?.category||DB.categories[0]?.id||'')}</select></div>
      <div class="form-group"><label class="form-label">帳戶 / 卡片</label><select class="form-select" id="feSrc"><option value="">請選擇</option>${srcOpts('both')}</select></div>
    </div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="feNotes" value="${escAttr(fe?.notes||'')}" placeholder=""></div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFixed()">儲存</button>`;
    setTimeout(() => { const el=document.getElementById('feSrc'); if(el&&preFeSrc) el.value=preFeSrc; }, 60);
  }

  // ── ADD / EDIT CATEGORY ──
  else if (type==='addCat'||type==='editCat') {
    t = cat ? '編輯類別' : '新增類別';
    b = `<div class="form-group"><label class="form-label">類別名稱</label><input class="form-input" id="catN" value="${escAttr(cat?.name||'')}" placeholder="e.g. 旅遊"></div>
    <div class="form-group"><label class="form-label">月度消費額度（0 = 不設限）</label><input class="form-input" id="catB" type="number" value="${cat?.budget||0}"></div>
    <div class="form-group"><label class="form-label">類別顏色</label>${colorPicker('catC', cat?.color||'#0057B8')}</div>`;
    f = `<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCat()">儲存</button>`;
  }

  document.getElementById('modalTitle').textContent = t;
  document.getElementById('modalBody').innerHTML    = b;
  document.getElementById('modalFooter').innerHTML  = f;
  overlay.classList.add('active');
}

function closeModal()            { document.getElementById('modalOverlay').classList.remove('active'); modalType=null; editTarget=null; }
function closeModalOverlay(e)   { if(e.target===document.getElementById('modalOverlay')) closeModal(); }

// ── SAVE HANDLERS ─────────────────────────────────────────────
function saveCard() {
  const name = document.getElementById('cName').value.trim();
  if (!name) { toast('請填入卡片名稱','danger'); return; }
  const obj = { name, color: v('cColor'), icon: v('cIcon'), limit: +v('cLimit')||0 };
  if (modalType==='editCard') { Object.assign(getCard(editTarget), obj); toast('信用卡已更新','success'); }
  else { DB.creditCards.push({ id:uid(), ...obj }); toast('信用卡新增成功','success'); }
  saveDB(); closeModal(); renderCards();
}

function saveAccount() {
  const name = document.getElementById('aName').value.trim();
  if (!name) { toast('請填入帳戶名稱','danger'); return; }
  const obj = { name, color: v('aColor'), icon: v('aIcon') };
  if (modalType==='editAccount') { Object.assign(getAcc(editTarget), obj); toast('帳戶已更新','success'); }
  else { DB.bankAccounts.push({ id:uid(), ...obj, layers:[] }); toast('帳戶新增成功','success'); }
  saveDB(); closeModal(); renderAccounts();
}

function saveLayer() {
  const accId  = v('lAccId');
  const layId  = v('lLayId');
  const label  = document.getElementById('lLabel').value.trim();
  const amount = +document.getElementById('lAmt').value || 0;
  const color  = v('lColor');
  if (!label) { toast('請填入分層名稱','danger'); return; }
  const acc = getAcc(accId); if (!acc) return;
  if (layId) {
    const l = acc.layers.find(x => x.id===layId);
    if (l) Object.assign(l, { label, amount, color });
    toast('分層已更新','success');
  } else {
    acc.layers.push({ id:uid(), label, amount, color });
    toast('分層新增成功','success');
  }
  saveDB(); closeModal(); renderAccounts();
}

function saveTxn() {
  const date = v('tDate'), type = v('tType'), amt = +v('tAmt'),
        desc = document.getElementById('tDesc').value.trim(),
        catId= v('tCat'), srcVal=v('tSrc'), notes=v('tNotes');
  if (!date||!amt||!desc||!srcVal) { toast('請填寫完整資訊','danger'); return; }
  const [sType,sId] = srcVal.split('_');
  const amount = type==='expense' ? -Math.abs(amt) : Math.abs(amt);
  if (modalType==='editTxn') {
    Object.assign(DB.transactions.find(t=>t.id===editTarget), { date, amount, desc, category:catId, sourceId:sId, sourceType:sType, notes });
    toast('記錄已更新','success');
  } else {
    DB.transactions.push({ id:uid(), date, amount, desc, category:catId, sourceId:sId, sourceType:sType, notes, isFixed:false });
    const cat = getCat(catId);
    if (cat.budget>0 && amount<0 && catMonthSpend(catId)>cat.budget) toast('⚠ 類別「'+cat.name+'」已超過本月額度！','danger');
    else toast('記錄新增成功','success');
  }
  saveDB(); closeModal(); renderTxns();
}

function doPayment() {
  const cardId = v('pyCardId'), amt=+v('pyAmt'), fromVal=v('pyFrom'),
        date=v('pyDate'), notes=v('pyNotes');
  if (!amt||!fromVal) { toast('請填寫完整資訊','danger'); return; }
  const [,fromId] = fromVal.split('_');
  const card = getCard(cardId);
  const lastCatId = DB.categories[DB.categories.length-1]?.id||'';
  DB.transactions.push({ id:uid(), date, amount:-Math.abs(amt), desc:'信用卡繳款 — '+(card?.name||''), category:lastCatId, sourceId:fromId, sourceType:'account', notes, isPayment:true });
  DB.transactions.push({ id:uid(), date, amount:+Math.abs(amt), desc:'繳款入帳 — '+(card?.name||''), category:lastCatId, sourceId:cardId, sourceType:'card',    notes, isPayment:true });
  saveDB(); closeModal(); renderCards(); toast('繳款成功！','success');
}

function doTransfer() {
  const fromId=v('tfFrom'), toId=v('tfTo'), amt=+v('tfAmt'), date=v('tfDate'), notes=v('tfNotes');
  if (!fromId||!toId||!amt) { toast('請填寫完整資訊','danger'); return; }
  if (fromId===toId) { toast('不能轉帳到相同帳戶','danger'); return; }
  const from=getAcc(fromId), to=getAcc(toId);
  const lastCatId = DB.categories[DB.categories.length-1]?.id||'';
  DB.transactions.push({ id:uid(), date, amount:-Math.abs(amt), desc:'轉帳 → '+(to?.name||''),   category:lastCatId, sourceId:fromId, sourceType:'account', notes, isTransfer:true });
  DB.transactions.push({ id:uid(), date, amount:+Math.abs(amt), desc:'轉入 ← '+(from?.name||''), category:lastCatId, sourceId:toId,   sourceType:'account', notes, isTransfer:true });
  saveDB(); closeModal(); renderAccounts(); toast('轉帳成功！','success');
}

function saveFixed() {
  const day=+v('feDay'), amt=+v('feAmt'),
        desc=document.getElementById('feDesc').value.trim(),
        catId=v('feCat'), srcVal=v('feSrc'), notes=v('feNotes');
  if (!day||!amt||!desc||!srcVal) { toast('請填寫完整資訊','danger'); return; }
  const [sType,sId] = srcVal.split('_');
  const obj = { day, amount:amt, desc, category:catId, sourceId:sId, sourceType:sType, notes };
  if (modalType==='editFixed') {
    Object.assign(DB.fixedExpenses.find(f=>f.id===editTarget), obj);
    toast('固定消費已更新','success');
  } else {
    DB.fixedExpenses.push({ id:uid(), ...obj });
    toast('固定消費新增成功','success');
  }
  saveDB(); closeModal(); renderFixed();
}

function saveCat() {
  const name=document.getElementById('catN').value.trim(), budget=+v('catB')||0, color=v('catC');
  if (!name) { toast('請填入類別名稱','danger'); return; }
  if (modalType==='editCat') { Object.assign(DB.categories.find(c=>c.id===editTarget),{name,budget,color}); toast('類別已更新','success'); }
  else { DB.categories.push({id:uid(),name,budget,color}); toast('類別新增成功','success'); }
  saveDB(); closeModal(); renderSettings();
}

// ── HELPERS ───────────────────────────────────────────────────
function v(id) { const el=document.getElementById(id); return el?el.value:''; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function emptyState(icon, title, desc) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-title">${title||''}</div>${desc?`<div class="empty-desc">${desc}</div>`:''}</div>`;
}

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg, type) {
  const icons = { success:'✅', danger:'❌', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'info');
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastWrap').prepend(el);
  setTimeout(() => el.remove(), 3500);
}

// ── INIT ──────────────────────────────────────────────────────
function init() {
  const now = new Date();
  document.getElementById('navMonth').textContent =
    now.getFullYear() + ' / ' + String(now.getMonth()+1).padStart(2,'0');

  document.getElementById('menuToggle').onclick = () =>
    document.getElementById('sidebar').classList.toggle('open');

  // Default date filter = current month
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('filterFrom').value = y + '-' + m + '-01';
  document.getElementById('filterTo').value   = today();

  generateFixed();
  renderDashboard();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
