<script>
// ════════════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════════════
const SK = 'mwallet_v2';
let DB = loadDB();
let charts = {};
let modalType = null, editTarget = null;
let dashRange = 'month';
let selectedTxns = new Set();

function defaultDB() {
  return {
    creditCards: [], bankAccounts: [], transactions: [],
    fixedExpenses: [], generatedFixed: {},
    categories: [
      { id: uid(), name: '餐飲',   color: '#e31836', budget: 0 },
      { id: uid(), name: '交通',   color: '#1c69d4', budget: 0 },
      { id: uid(), name: '購物',   color: '#9b59b6', budget: 0 },
      { id: uid(), name: '娛樂',   color: '#f39c12', budget: 0 },
      { id: uid(), name: '醫療',   color: '#27ae60', budget: 0 },
      { id: uid(), name: '訂閱',   color: '#00bcd4', budget: 0 },
      { id: uid(), name: '其他',   color: '#7f8c8d', budget: 0 },
    ]
  };
}
function loadDB() {
  try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); } catch {}
  return defaultDB();
}
function saveDB() { localStorage.setItem(SK, JSON.stringify(DB)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n) { return 'NT$' + Math.abs(Math.round(n)).toLocaleString('zh-TW'); }
function today() { return new Date().toISOString().slice(0,10); }
function nowYM() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ym(d) { return (d||'').slice(0,7); }
function getCat(id) { return DB.categories.find(c=>c.id===id)||{name:'—',color:'#7f8c8d',budget:0}; }
function getCard(id) { return DB.creditCards.find(c=>c.id===id); }
function getAcc(id)  { return DB.bankAccounts.find(a=>a.id===id); }
function v(id) { const el=document.getElementById(id); return el?el.value:''; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function emptyState(icon,title,desc) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><div class="empty-title">${title||''}</div>${desc?`<div class="empty-desc">${desc}</div>`:''}</div>`;
}

// ════════════════════════════════════════════════════════════════
// THEME — auto sunrise/sunset for Taichung (24.15N, 120.67E)
// ════════════════════════════════════════════════════════════════
let manualTheme = localStorage.getItem('mwallet_theme') || 'auto';

function getSunTimes(date) {
  const lat = 24.15, lng = 120.67;
  const rad = Math.PI / 180;
  const N   = Math.floor((date - new Date(date.getFullYear(),0,0)) / 86400000);
  const B   = (360/365) * (N-81) * rad;
  const ET  = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  const dec = 23.45 * Math.sin(B) * rad;
  const ha  = Math.acos(-Math.tan(lat*rad)*Math.tan(dec)) / rad;
  const tz  = 8;
  const noon = 12 - ET/60 - (lng - tz*15)/15;
  return { sunrise: noon - ha/15, sunset: noon + ha/15 };
}

function applyTheme(theme) {
  const body = document.getElementById('appBody');
  const btn  = document.getElementById('themeToggle');
  if (theme === 'light') {
    body.classList.add('light-theme');
    if (btn) btn.textContent = '☀️';
  } else {
    body.classList.remove('light-theme');
    if (btn) btn.textContent = '🌙';
  }
}

function autoTheme() {
  if (manualTheme !== 'auto') { applyTheme(manualTheme); return; }
  const now = new Date();
  const { sunrise, sunset } = getSunTimes(now);
  const h = now.getHours() + now.getMinutes()/60;
  applyTheme((h >= sunrise && h < sunset) ? 'light' : 'dark');
}

function toggleTheme() {
  const body = document.getElementById('appBody');
  const isLight = body.classList.contains('light-theme');
  if (manualTheme === 'auto') {
    manualTheme = isLight ? 'dark' : 'light';
  } else if (manualTheme === 'light') {
    manualTheme = 'dark';
  } else {
    manualTheme = 'auto';
    toast('已切換為日出/日落自動模式','info');
  }
  localStorage.setItem('mwallet_theme', manualTheme);
  autoTheme();
}

// ════════════════════════════════════════════════════════════════
// COMPUTED
// ════════════════════════════════════════════════════════════════
function cardBalance(id) {
  return DB.transactions.filter(t=>t.sourceType==='card'&&t.sourceId===id)
    .reduce((s,t)=>s+t.amount,0);
}
function accountBalance(id) {
  const acc = getAcc(id); if (!acc) return 0;
  const lay = (acc.layers||[]).reduce((s,l)=>s+(l.amount||0),0);
  const tx  = DB.transactions.filter(t=>t.sourceType==='account'&&t.sourceId===id)
    .reduce((s,t)=>s+t.amount,0);
  return lay + tx;
}
function rangedTxns() {
  const now = new Date();
  const t0 = today();
  if (dashRange === 'today')
    return DB.transactions.filter(t=>t.date===t0);
  if (dashRange === '7') {
    const d = new Date(now); d.setDate(d.getDate()-6);
    const from = d.toISOString().slice(0,10);
    return DB.transactions.filter(t=>t.date>=from&&t.date<=t0);
  }
  if (dashRange === '30') {
    const d = new Date(now); d.setDate(d.getDate()-29);
    const from = d.toISOString().slice(0,10);
    return DB.transactions.filter(t=>t.date>=from&&t.date<=t0);
  }
  if (dashRange === 'month')
    return DB.transactions.filter(t=>ym(t.date)===nowYM());
  return DB.transactions;
}
function thisMonthCCSpend() {
  return DB.transactions.filter(t=>t.sourceType==='card'&&t.amount<0&&ym(t.date)===nowYM())
    .reduce((s,t)=>s+t.amount,0);
}
function catMonthSpend(id) {
  return DB.transactions.filter(t=>t.category===id&&t.amount<0&&ym(t.date)===nowYM())
    .reduce((s,t)=>s+Math.abs(t.amount),0);
}
function sourceName(t) {
  if (t.sourceType==='card')    { const c=getCard(t.sourceId); return c?c.name:'已刪除'; }
  if (t.sourceType==='account') { const a=getAcc(t.sourceId);  return a?a.name:'已刪除'; }
  return '—';
}
// Days until credit card due date
function daysUntilDue(card) {
  if (!card.dueDay) return null;
  const now = new Date(); 
  const d = new Date(now.getFullYear(), now.getMonth(), card.dueDay);
  if (d < now) d.setMonth(d.getMonth()+1);
  return Math.ceil((d - now) / 86400000);
}
// Card monthly cashback
function cardMonthlyCashback(card) {
  if (!card.cashbackRate || card.cashbackRate <= 0) return 0;
  const mSpend = DB.transactions
    .filter(t=>t.sourceType==='card'&&t.sourceId===card.id&&t.amount<0&&ym(t.date)===nowYM()&&!t.isPayment)
    .reduce((s,t)=>s+Math.abs(t.amount),0);
  return Math.floor(mSpend * card.cashbackRate / 100);
}

// ════════════════════════════════════════════════════════════════
// FIXED AUTO-GENERATE
// ════════════════════════════════════════════════════════════════
function generateFixed() {
  const now = new Date(), curYM = nowYM(), curDay = now.getDate();
  if (!DB.generatedFixed[curYM]) DB.generatedFixed[curYM] = [];
  let added = 0;
  DB.fixedExpenses.forEach(fe => {
    if (DB.generatedFixed[curYM].includes(fe.id)) return;
    if (curDay < fe.day) return;
    const d = String(Math.min(fe.day,28)).padStart(2,'0');
    DB.transactions.push({ id:uid(), date:curYM+'-'+d, amount:-Math.abs(fe.amount),
      desc:fe.desc+'（固定）', category:fe.category, sourceId:fe.sourceId,
      sourceType:fe.sourceType, notes:fe.notes||'', isFixed:true, fixedId:fe.id });
    DB.generatedFixed[curYM].push(fe.id);
    added++;
  });
  if (added) { saveDB(); toast('已自動新增 '+added+' 筆固定消費','info'); }
}

// ════════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════════
function nav(el, page) {
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  renderPage(page);
}
function renderPage(page) {
  const fn={dashboard:renderDashboard,cards:renderCards,accounts:renderAccounts,
    txns:renderTxns,fixed:renderFixed,analytics:renderAnalytics,settings:renderSettings};
  if (fn[page]) fn[page]();
}

// ════════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════════
function setDashRange(el, range) {
  dashRange = range;
  document.querySelectorAll('.dash-filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderDashboard();
}

function renderDashboard() {
  const rtx = rangedTxns();
  const spend  = Math.abs(rtx.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0));
  const income = rtx.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const totalDebt = DB.creditCards.reduce((s,c)=>{const b=cardBalance(c.id);return s+(b<0?Math.abs(b):0);},0);
  const totalBank = DB.bankAccounts.reduce((s,a)=>s+accountBalance(a.id),0);
  const ccSpend   = Math.abs(thisMonthCCSpend());
  const salarySum = DB.bankAccounts.reduce((s,a)=>{
    const l=(a.layers||[]).find(l=>l.label.includes('薪')); return s+(l?l.amount:0);
  },0);
  const labels = {month:'本月',30:'近30天',7:'近7天',today:'今天',all:'全部'};
  const lbl = labels[dashRange]||'';

  document.getElementById('dashStats').innerHTML =
    statCard(lbl+'消費', fmt(-spend), spend>0?'danger':'', '', '💸') +
    statCard(lbl+'收入', fmt(income), income>0?'success':'', '', '📥') +
    statCard('信用卡未償還', fmt(-totalDebt), totalDebt>0?'danger':'success', '所有卡片累積', '💳') +
    statCard('銀行總資產', fmt(totalBank), 'blue', '所有帳戶餘額', '🏦') +
    statCard('本月剩餘生活費', fmt(salarySum-ccSpend), (salarySum-ccSpend)<0?'danger':(salarySum-ccSpend)<salarySum*0.2?'warning':'success','薪水 − 本月CC消費','💰');

  document.getElementById('dashCards').innerHTML =
    DB.creditCards.map(c=>{
      const bal=cardBalance(c.id);
      const due=daysUntilDue(c);
      const dueCls=due!==null?(due<=2?'a-over':due<=5?'a-neg':''):'';
      return `<div class="layer-bar" style="border-left:3px solid ${c.color}">
        <div style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0"></div>
        <span style="flex:1;font-size:13px">${c.name}</span>
        ${due!==null?`<span class="${dueCls}" style="font-size:11px;margin-right:8px">${due<=0?'今日截止':due+'天後繳款'}</span>`:''}
        <span class="layer-amt ${bal<0?'a-neg':'a-pos'}">${bal<0?'−':'+'}${fmt(Math.abs(bal))}</span>
      </div>`;
    }).join('')||emptyState('💳','尚無信用卡');

  document.getElementById('dashAccounts').innerHTML =
    DB.bankAccounts.map(a=>{

function statCard(label,val,cls,sub,icon) {

function renderCards() {

    statCard('本月現金回饋',fmt(-totalCashback),'success','所有卡片回饋合計','🎁') +

    const due     = daysUntilDue(c);
    const barColor= used>80?'var(--m-red)':used>50?'var(--warn)':'var(--m-blue)';
    const dueCls  = due!==null?(due<=2?'glow-red-txt':due<=5?'orange-txt':'green-txt'):'';
    const dueHtml = due!==null
      ? `<div class="due-badge ${dueCls}">${due<=0?'⚠ 今日繳款截止':due<=2?'⚠ '+due+'天後到期':due+'天後繳款'}</div>`
      : '';

    return `<div class="account-card">
      <div class="account-card-header" style="border-top:3px solid ${c.color}">
        <div class="account-card-icon" style="background:${c.color}22">${icon}</div>
        <div style="flex:1">
          <div class="account-card-name">${escHtml(c.name)}</div>
          <div class="account-card-type">CREDIT CARD${c.limit?'　額度 '+fmt(c.limit):''}${c.billingDay?'　結帳日 '+c.billingDay+'號':''}</div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editCard','${c.id}')">✏️</button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="deleteCard('${c.id}')">🗑</button>
        </div>
      </div>
      <div class="account-card-body">
        ${dueHtml}
        <div style="font-size:11px;color:var(--tx-muted);margin-bottom:4px">當前餘額</div>
        <div class="account-balance ${isNeg?'negative':'positive'}">${isNeg?'−':'+'}${fmt(Math.abs(bal))}</div>
        <div style="display:flex;gap:16px;margin-top:6px;flex-wrap:wrap">
          <div style="font-size:11px;color:var(--tx-secondary)">本月消費：<span style="color:var(--tx-red)">${fmt(-mSpend)}</span></div>
          ${c.cashbackRate>0?`<div style="font-size:11px;color:var(--tx-secondary)">本月回饋：<span style="color:var(--tx-green)">+${fmt(-cashback)}</span><span style="font-size:10px;color:var(--tx-muted)">（${c.cashbackRate}%）</span></div>`:''}
        </div>
        ${c.limit>0?`<div class="prog-wrap mt-2"><div class="prog-bar" style="width:${used}%;background:${barColor}"></div></div><div style="font-size:10px;color:var(--tx-muted);margin-top:3px">已用 ${used.toFixed(0)}%</div>`:''}
      </div>
      <div class="account-card-footer">
        <button class="btn btn-sm btn-primary" onclick="openModal('payment','${c.id}')">💸 繳款</button>
        <button class="btn btn-sm btn-ghost"   onclick="openModal('addTxn',null,'${c.id}')">＋ 消費</button>
        <button class="btn btn-sm btn-ghost"   onclick="filterByCard('${c.id}')">📋 明細</button>
      </div>
    </div>`;
  }).join('');
  html += `<div class="add-card-btn" onclick="openModal('addCard')"><div class="add-card-icon">＋</div><div class="add-card-label">新增信用卡</div></div>`;
  document.getElementById('cardsGrid').innerHTML = html;
}

function deleteCard(id) {
  if (!confirm('確定刪除此信用卡？相關消費記錄也會一併刪除。')) return;

// ════════════════════════════════════════════════════════════════
// TRANSACTIONS
// ════════════════════════════════════════════════════════════════
function renderTxns() {
  // Populate source filter
  const srcSel=document.getElementById('filterSource'), oldSrc=srcSel.value;
  srcSel.innerHTML='<option value="">全部帳戶/卡片</option>';
  DB.creditCards.forEach(c=>{srcSel.innerHTML+=`<option value="card_${c.id}">[卡] ${escHtml(c.name)}</option>`;});
  DB.bankAccounts.forEach(a=>{srcSel.innerHTML+=`<option value="account_${a.id}">[帳] ${escHtml(a.name)}</option>`;});
  srcSel.value=oldSrc;
  const catSel=document.getElementById('filterCat'), oldCat=catSel.value;
  catSel.innerHTML='<option value="">全部類別</option>';
  DB.categories.forEach(c=>{catSel.innerHTML+=`<option value="${c.id}">${escHtml(c.name)}</option>`;});
  catSel.value=oldCat;

  const from=v('filterFrom'), to=v('filterTo'), srcVal=srcSel.value,
        catVal=catSel.value, typeVal=v('filterType'),
        keyword=(v('txnSearch')||'').toLowerCase().trim();

  let txns=[...DB.transactions].sort((a,b)=>b.date.localeCompare(a.date));
  if (from)     txns=txns.filter(t=>t.date>=from);
  if (to)       txns=txns.filter(t=>t.date<=to);
  if (srcVal)   { const [tp,sid]=srcVal.split('_'); txns=txns.filter(t=>t.sourceType===tp&&t.sourceId===sid); }
  if (catVal)   txns=txns.filter(t=>t.category===catVal);
  if (typeVal==='expense') txns=txns.filter(t=>t.amount<0);
  if (typeVal==='income')  txns=txns.filter(t=>t.amount>0);
  if (keyword)  txns=txns.filter(t=>(t.desc||'').toLowerCase().includes(keyword)||(t.notes||'').toLowerCase().includes(keyword));

  document.getElementById('txnTableWrap').innerHTML = txnTable(txns, true);
  updateBatchUI();
}

function txnTable(txns, withActions) {
  if (!txns.length) return emptyState('📋','無消費記錄','點擊「新增記錄」開始記帳');
  const rows = txns.map(t => {
    const cat    = getCat(t.category);
    const spent  = cat.budget>0?catMonthSpend(t.category):0;
    const isOver = cat.budget>0&&spent>cat.budget&&t.amount<0;
    const amtCls = t.amount>0?'a-pos':isOver?'a-over':'a-neg';
    const sign   = t.amount>0?'+':'−';
    const tags   = (t.isFixed?'<span class="badge badge-violet" style="margin-left:4px">固定</span>':'')
                 + (t.isPayment?'<span class="badge badge-green" style="margin-left:4px">繳款</span>':'')
                 + (t.isTransfer?'<span class="badge badge-blue" style="margin-left:4px">轉帳</span>':'')
                 + (t.isRedemption?'<span class="badge" style="margin-left:4px;background:#f39c1222;color:#f39c12;border:1px solid #f39c1244">折抵</span>':'');
    const chk = withActions
      ? `<td><input type="checkbox" class="txn-chk" data-id="${t.id}" onchange="updateBatchUI()"></td>`
      : '';
    const act = withActions
      ? `<td style="white-space:nowrap">
          <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editTxn','${t.id}')">✏️</button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="deleteTxn('${t.id}')">🗑</button>
        </td>`
      : '';
    return `<tr>
      ${chk}
      <td style="white-space:nowrap">${t.date}</td>
      <td>${escHtml(t.desc)}${tags}</td>
      <td><span class="badge" style="background:${cat.color}22;color:${cat.color};border:1px solid ${cat.color}55">${cat.name}</span></td>
      <td style="white-space:nowrap">${sourceName(t)}</td>
      <td class="${amtCls}" style="white-space:nowrap">${sign}${fmt(Math.abs(t.amount))}</td>
      <td style="color:var(--tx-secondary);font-size:12px">${escHtml(t.notes||'—')}</td>
      ${act}
    </tr>`;
  }).join('');
  const total = txns.reduce((s,t)=>s+t.amount,0);
  const cols  = withActions ? 7 : 5;
  const chkTh = withActions ? '<th style="width:32px"><input type="checkbox" id="chkAll" onchange="toggleAllChk(this)"></th>' : '';
  const actTh = withActions ? '<th>操作</th>' : '';
  return `<table>
    <thead><tr>${chkTh}<th>日期</th><th>內容</th><th>類別</th><th>帳戶/卡片</th><th>金額</th><th>備註</th>${actTh}</tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:var(--bg-secondary)">
      ${withActions?'<td></td>':''}
      <td colspan="4" style="padding:10px 14px;font-size:11px;color:var(--tx-muted)">共 ${txns.length} 筆</td>
      <td style="padding:10px 14px;font-weight:700;font-family:var(--ff-display);font-size:15px;color:${total<0?'var(--tx-red)':'var(--tx-green)'}">${total>=0?'+':'−'}${fmt(Math.abs(total))}</td>
      <td colspan="${withActions?2:0}"></td>
    </tr></tfoot>
  </table>`;
}

function updateBatchUI() {
  const chks = document.querySelectorAll('.txn-chk:checked');
  const btn  = document.getElementById('batchDelBtn');
  const cnt  = document.getElementById('batchCount');
  if (btn) { btn.style.display = chks.length>0?'':'none'; }
  if (cnt) cnt.textContent = chks.length;
}
function toggleAllChk(el) {
  document.querySelectorAll('.txn-chk').forEach(c=>{c.checked=el.checked;});
  updateBatchUI();
}
function batchDelete() {
  const ids=[...document.querySelectorAll('.txn-chk:checked')].map(c=>c.dataset.id);
  if (!ids.length) return;
  if (!confirm(`確定刪除選取的 ${ids.length} 筆記錄？`)) return;
  DB.transactions=DB.transactions.filter(t=>!ids.includes(t.id));
  saveDB(); renderTxns(); toast(`已刪除 ${ids.length} 筆記錄`,'danger');
}
function copyLastTxn() {
  const last=[...DB.transactions].sort((a,b)=>b.date.localeCompare(a.date)).find(t=>!t.isPayment&&!t.isTransfer);
  if (!last) { toast('尚無消費記錄可複製','info'); return; }
  openModal('addTxn');
  setTimeout(()=>{
    const el=document.getElementById('tDate'); if(el) el.value=today();
    const am=document.getElementById('tAmt'); if(am) am.value=Math.abs(last.amount);
    const ds=document.getElementById('tDesc'); if(ds) ds.value=last.desc.replace('（固定）','');
    const ct=document.getElementById('tCat'); if(ct) ct.value=last.category;
    const sr=document.getElementById('tSrc'); if(sr) sr.value=last.sourceType+'_'+last.sourceId;
    const tp=document.getElementById('tType'); if(tp) tp.value=last.amount<0?'expense':'income';
    const nt=document.getElementById('tNotes'); if(nt) nt.value=last.notes||'';
    toast('已複製上筆消費資訊','info');
  },80);
}
function deleteTxn(id) {
  if (!confirm('確定刪除？')) return;
  DB.transactions=DB.transactions.filter(t=>t.id!==id);
  saveDB(); renderTxns(); toast('記錄已刪除','danger');
}
function exportExcel() {
  const from=v('filterFrom'), to=v('filterTo');
  let txns=[...DB.transactions].sort((a,b)=>a.date.localeCompare(b.date));
  if (from) txns=txns.filter(t=>t.date>=from);
  if (to)   txns=txns.filter(t=>t.date<=to);
  const data=txns.map(t=>({'日期':t.date,'內容':t.desc,'類別':getCat(t.category).name,'帳戶/卡片':sourceName(t),'金額':t.amount,'備註':t.notes||''}));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'消費明細');
  XLSX.writeFile(wb,'MWallet_'+(from||'all')+'_'+(to||'all')+'.xlsx');
  toast('Excel 匯出成功！','success');
}

function renderAnalytics() {
  const yearSel=document.getElementById('analyticsYear');
  if (!yearSel.options.length) {
    const cur=new Date().getFullYear();
    const years=new Set(DB.transactions.map(t=>t.date.slice(0,4)));
    [String(cur-1),String(cur),String(cur+1)].forEach(y=>years.add(y));
    [...years].sort().forEach(y=>{
      const o=document.createElement('option');
      o.value=y; o.textContent=y+' 年'; if(y===String(cur))o.selected=true;
      yearSel.appendChild(o);
    });
  }
  const year=yearSel.value||String(new Date().getFullYear());
  const ytx=DB.transactions.filter(t=>t.date.startsWith(year));
  const ysp=Math.abs(ytx.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0));
  const yin=ytx.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const maxCat=DB.categories.reduce((best,c)=>{
    const v2=Math.abs(ytx.filter(t=>t.category===c.id&&t.amount<0).reduce((s,t)=>s+t.amount,0));
    return v2>(best.v||0)?{name:c.name,v:v2}:best;
  },{});
  document.getElementById('analyticsStats').innerHTML=
    statCard(year+' 年度總支出',fmt(-ysp),ysp>0?'danger':'','','📉')+
    statCard(year+' 年度總收入',fmt(yin),yin>0?'success':'','','📈')+
    statCard('月均消費',fmt(-ysp/12),'warning','','📊')+
    statCard('最大消費類別',maxCat.name||'—','blue',maxCat.v?fmt(-maxCat.v):'','🏷');

  const months=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const mLabels=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const mSp=months.map(m=>Math.abs(DB.transactions.filter(t=>t.date.startsWith(year+'-'+m)&&t.amount<0).reduce((s,t)=>s+t.amount,0)));
  const mIn=months.map(m=>DB.transactions.filter(t=>t.date.startsWith(year+'-'+m)&&t.amount>0).reduce((s,t)=>s+t.amount,0));

  if (charts.trend) charts.trend.destroy();
  charts.trend=new Chart(document.getElementById('trendChart').getContext('2d'),{
    type:'line',data:{labels:mLabels,datasets:[
      {label:'支出',data:mSp,borderColor:'#C8102E',backgroundColor:'rgba(200,16,46,0.1)',tension:.4,fill:true,pointBackgroundColor:'#C8102E',pointRadius:4},
      {label:'收入',data:mIn,borderColor:'#00C853',backgroundColor:'rgba(0,200,83,0.1)',tension:.4,fill:true,pointBackgroundColor:'#00C853',pointRadius:4}
    ]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8080A8'}}},scales:{x:{ticks:{color:'#8080A8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8080A8',callback:v2=>'NT$'+v2.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'}}}}
  });

  const catSp=DB.categories.map(c=>catMonthSpend(c.id));
  if (charts.cat) charts.cat.destroy();
  charts.cat=new Chart(document.getElementById('catChart').getContext('2d'),{
    type:'doughnut',data:{labels:DB.categories.map(c=>c.name),datasets:[{data:catSp,backgroundColor:DB.categories.map(c=>c.color),borderWidth:2,borderColor:'#1A1A2E'}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8080A8',font:{size:11}},position:'bottom'}}}
  });

  const catYr=DB.categories.map(c=>Math.abs(DB.transactions.filter(t=>t.category===c.id&&t.date.startsWith(year)&&t.amount<0).reduce((s,t)=>s+t.amount,0)));
  if (charts.catBar) charts.catBar.destroy();
  charts.catBar=new Chart(document.getElementById('catBarChart').getContext('2d'),{
    type:'bar',data:{labels:DB.categories.map(c=>c.name),datasets:[{label:'年度支出',data:catYr,backgroundColor:DB.categories.map(c=>c.color+'cc'),borderRadius:5}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#8080A8'}}},scales:{x:{ticks:{color:'#8080A8'},grid:{display:false}},y:{ticks:{color:'#8080A8',callback:v2=>'NT$'+v2.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'}}}}
  });
}

function renderSettings() {
  const wrap = document.getElementById('catList');
  if (!DB.categories.length) { wrap.innerHTML=emptyState('🏷','尚無類別'); return; }
  wrap.innerHTML = DB.categories.map((c,i) => {
    const spent=catMonthSpend(c.id), isOver=c.budget>0&&spent>c.budget;
    const pct=c.budget>0?Math.min(100,spent/c.budget*100):0;
    const iconEl = c.icon
      ? `<img src="${c.icon}" style="width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0">`
      : `<div style="width:32px;height:32px;border-radius:8px;background:${c.color};display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${c.emoji||'🏷'}</div>`;
    return `<div class="cat-row" draggable="true" data-id="${c.id}" data-index="${i}"
      ondragstart="catDragStart(event,${i})" ondragover="catDragOver(event)" ondrop="catDrop(event,${i})" ondragend="catDragEnd(event)">
      <span class="cat-drag-handle" title="拖曳排序">⠿</span>
      ${iconEl}
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${escHtml(c.name)}</div>
        ${c.budget>0?`<div class="prog-wrap mt-2" style="max-width:180px"><div class="prog-bar" style="width:${pct}%;background:${isOver?'var(--m-red)':'var(--m-blue)'}"></div></div>`:''}
      </div>
      <span style="font-size:12px;color:var(--tx-secondary);margin-right:6px">本月：${fmt(-spent)}</span>
      ${c.budget>0?`<span class="badge ${isOver?'badge-red':'badge-green'}">${isOver?'⚠ 超支':'正常'}　${fmt(-c.budget)}</span>`:'<span class="badge badge-gray">無額度</span>'}
      <div style="display:flex;gap:2px;margin-left:6px">
        <button class="btn btn-ghost btn-icon btn-sm" onclick="moveCat(${i},-1)" title="上移" ${i===0?'disabled':''}>▲</button>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="moveCat(${i},1)"  title="下移" ${i===DB.categories.length-1?'disabled':''}>▼</button>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="openModal('editCat','${c.id}')">✏️</button>
        <button class="btn btn-danger btn-icon btn-sm" onclick="deleteCat('${c.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ── CATEGORY REORDER ─────────────────────────────────────────
let catDragIdx = null;
function moveCat(idx, dir) {
  const to = idx + dir;
  if (to < 0 || to >= DB.categories.length) return;
  [DB.categories[idx], DB.categories[to]] = [DB.categories[to], DB.categories[idx]];
  saveDB(); renderSettings();
}
function catDragStart(e, idx) {
  catDragIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('cat-dragging');
}
function catDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='move'; }
function catDrop(e, toIdx) {
  e.preventDefault();
  if (catDragIdx === null || catDragIdx === toIdx) return;
  const arr = [...DB.categories];
  const [item] = arr.splice(catDragIdx, 1);
  arr.splice(toIdx, 0, item);
  DB.categories = arr;
  catDragIdx = null;
  saveDB(); renderSettings();
}
function catDragEnd(e) { e.currentTarget.classList.remove('cat-dragging'); catDragIdx=null; }
function deleteCat(id) {
  if (!confirm('確定刪除？')) return;
  DB.categories=DB.categories.filter(c=>c.id!==id);
  saveDB(); renderSettings(); toast('類別已刪除','danger');
}
function exportData() {
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='mwallet_backup_'+today()+'.json'; a.click(); toast('備份匯出成功！','success');
}
function importData(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{try{DB=JSON.parse(ev.target.result);saveDB();toast('匯入成功！','success');renderPage('settings');}catch{toast('匯入失敗','danger');}};
  r.readAsText(f); e.target.value='';
}
function confirmClearAll() {
  if (!confirm('⚠ 確定清除所有資料？此動作無法復原！')) return;
  DB=defaultDB(); saveDB(); toast('資料已清除','danger'); renderDashboard();
}

const SWATCHES=['#C8102E','#0057B8','#6F2CA7','#00C853','#FF8F00','#00BCD4','#FF4081','#e67e22','#1abc9c','#795548','#607D8B','#E91E63','#ff6b35','#2ecc71'];

function colorPicker(fid,cur) {
  cur=cur||'#0057B8';
  const sw=SWATCHES.map(c=>`<div class="c-swatch${cur===c?' sel':''}" style="background:${c}" onclick="selectColor('${fid}','${c}',this)"></div>`).join('');
  return `<div class="color-picker-row" id="cpRow_${fid}">
    ${sw}
    <div class="c-custom" title="自訂">＋<input type="color" value="${cur}" oninput="selectColor('${fid}',this.value,null)"></div>
    <input type="hidden" id="${fid}" value="${cur}">
    <div class="color-preview" id="cpPrev_${fid}" style="background:${cur}"></div>
  </div>`;
}
function selectColor(fid,color,swEl) {
  const inp=document.getElementById(fid); if(inp) inp.value=color;
  const prev=document.getElementById('cpPrev_'+fid); if(prev) prev.style.background=color;
  const row=document.getElementById('cpRow_'+fid);
  if(row) row.querySelectorAll('.c-swatch').forEach(s=>s.classList.remove('sel'));
  if(swEl) swEl.classList.add('sel');
}
function iconUpload(fid,cur) {
  cur=cur||'';
  return `<div>
    <div class="icon-upload" onclick="document.getElementById('${fid}_inp').click()">
      ${cur?`<img src="${cur}" id="${fid}_img" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`:`<span id="${fid}_img" style="font-size:22px">🖼</span>`}
      <input type="file" id="${fid}_inp" accept="image/*" style="display:none" onchange="loadIcon('${fid}',this)">
    </div>
    <div style="text-align:center;font-size:9px;color:var(--tx-muted);margin-top:4px">點擊上傳</div>
    <input type="hidden" id="${fid}" value="${cur}">
  </div>`;
}
function loadIcon(fid,input) {
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    document.getElementById(fid).value=e.target.result;
    const el=document.getElementById(fid+'_img');
    if(el&&el.tagName==='SPAN'){const img=document.createElement('img');img.id=fid+'_img';img.src=e.target.result;img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:inherit';el.replaceWith(img);}
    else if(el) el.src=e.target.result;
  };
  r.readAsDataURL(f);
}

    <div class="form-group"><label class="form-label">日期</label><input class="form-input" id="tfDate" type="date" value="${today()}"></div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="tfNotes"></div>`;
    f=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-violet" onclick="doTransfer()">🔄 確認轉帳</button>`;
  }

  // ── FIXED ──
  else if (type==='addFixed'||type==='editFixed') {
    t=fe?'編輯固定消費':'新增固定消費';
    const pFS=fe?fe.sourceType+'_'+fe.sourceId:'';
    b=`<div class="form-row">
      <div class="form-group"><label class="form-label">每月幾號</label><input class="form-input" id="feDay" type="number" min="1" max="28" value="${fe?.day||1}"></div>
      <div class="form-group"><label class="form-label">金額（NT$）</label><input class="form-input" id="feAmt" type="number" value="${fe?.amount||0}"></div>
    </div>
    <div class="form-group"><label class="form-label">消費內容</label><input class="form-input" id="feDesc" value="${escAttr(fe?.desc||'')}" placeholder="e.g. Netflix"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">類別</label><select class="form-select" id="feCat">${catOpts(fe?.category||DB.categories[0]?.id||'')}</select></div>
      <div class="form-group"><label class="form-label">帳戶/卡片</label><select class="form-select" id="feSrc"><option value="">請選擇</option>${srcOpts('both')}</select></div>
    </div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" id="feNotes" value="${escAttr(fe?.notes||'')}"></div>`;
    f=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveFixed()">儲存</button>`;
    setTimeout(()=>{const el=document.getElementById('feSrc');if(el&&pFS)el.value=pFS;},60);
  }

  // ── CATEGORY ──
  else if (type==='addCat'||type==='editCat') {
    t=cat?'編輯類別':'新增類別';
    b=`<div style="display:flex;gap:14px;align-items:flex-start">
      <div>
        ${iconUpload('catIcon', cat?.icon||'')}
        <div style="text-align:center;margin-top:6px">
          <div class="form-label" style="margin-bottom:4px">Emoji 圖示</div>
          <input class="form-input" id="catEmoji" value="${escAttr(cat?.emoji||'')}" placeholder="e.g. 🍔" style="width:64px;text-align:center;font-size:18px">
        </div>
      </div>
      <div style="flex:1">
        <div class="form-group"><label class="form-label">類別名稱</label><input class="form-input" id="catN" value="${escAttr(cat?.name||'')}" placeholder="e.g. 旅遊"></div>
        <div class="form-group"><label class="form-label">月度消費額度（0=不設限）</label><input class="form-input" id="catB" type="number" value="${cat?.budget||0}"></div>
        <div class="form-group"><label class="form-label" style="margin-bottom:6px">類別顏色</label>${colorPicker('catC',cat?.color||'#0057B8')}</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--tx-secondary);margin-top:8px">💡 可上傳圖片或輸入 Emoji，圖片優先顯示</div>`;
    f=`<button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCat()">儲存</button>`;
  }

  document.getElementById('modalTitle').textContent=t;
  document.getElementById('modalBody').innerHTML=b;
  document.getElementById('modalFooter').innerHTML=f;
  overlay.classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); modalType=null; editTarget=null; }
function closeModalOverlay(e) { if(e.target===document.getElementById('modalOverlay')) closeModal(); }

// ════════════════════════════════════════════════════════════════
// SAVE HANDLERS
// ════════════════════════════════════════════════════════════════
function saveCard() {
  const name=document.getElementById('cName').value.trim();
  if(!name){toast('請填入卡片名稱','danger');return;}
  const obj={name,color:v('cColor'),icon:v('cIcon'),limit:+v('cLimit')||0,
    billingDay:+v('cBillingDay')||null, dueDay:+v('cDueDay')||null,
    cashbackRate:+v('cCashback')||0, pointRate:+v('cPtRate')||0};
  if(modalType==='editCard'){Object.assign(getCard(editTarget),obj);toast('信用卡已更新','success');}
  else{DB.creditCards.push({id:uid(),...obj});toast('信用卡新增成功','success');}
  saveDB();closeModal();renderCards();
}
function saveAccount() {
  const name=document.getElementById('aName').value.trim();
  if(!name){toast('請填入帳戶名稱','danger');return;}
  const obj={name,color:v('aColor'),icon:v('aIcon'),
    last4:(document.getElementById('aLast4')?.value||'').trim(),
    accType:v('aType')||'活存',minBalance:+v('aMinBal')||0,
    notes:(document.getElementById('aNotes')?.value||'').trim()};
  const initBal = +(document.getElementById('aInitBal')?.value) || 0;
  if(modalType==='editAccount'){
    const acc = getAcc(editTarget);
    Object.assign(acc, obj);
    // 更新或新增「初始餘額」分層
    const existLayer = (acc.layers||[]).find(l=>l.label==='初始餘額');
    if (existLayer) {
      existLayer.amount = initBal;
      existLayer.color  = obj.color;
    } else if (initBal !== 0) {
      if (!acc.layers) acc.layers = [];
      acc.layers.unshift({id:uid(),label:'初始餘額',amount:initBal,color:obj.color});
    }
    toast('帳戶已更新','success');
  } else {
    const layers = initBal ? [{id:uid(),label:'初始餘額',amount:initBal,color:obj.color}] : [];
    DB.bankAccounts.push({id:uid(),...obj,layers});
    toast('帳戶新增成功','success');
  }
  saveDB();closeModal();renderAccounts();
}
function saveLayer() {
  const accId=v('lAccId'),layId=v('lLayId'),label=document.getElementById('lLabel').value.trim(),
        amount=+document.getElementById('lAmt').value||0,color=v('lColor');
  if(!label){toast('請填入分層名稱','danger');return;}
  const acc=getAcc(accId);if(!acc)return;
  if(layId){const l=acc.layers.find(x=>x.id===layId);if(l)Object.assign(l,{label,amount,color});toast('分層已更新','success');}
  else{acc.layers.push({id:uid(),label,amount,color});toast('分層新增成功','success');}
  saveDB();closeModal();renderAccounts();
}
function saveTxn() {
  const date=v('tDate'),type=v('tType'),amt=+v('tAmt'),
        desc=document.getElementById('tDesc').value.trim(),
        catId=v('tCat'),srcVal=v('tSrc'),notes=v('tNotes');
  if(!date||!amt||!desc||!srcVal){toast('請填寫完整資訊','danger');return;}
  const [sType,sId]=srcVal.split('_');
  const isRed = type==='redemption';
  const amount = type==='income'||isRed ? Math.abs(amt) : -Math.abs(amt);
  if(modalType==='editTxn'){
    Object.assign(DB.transactions.find(t=>t.id===editTarget),{date,amount,desc,category:catId,sourceId:sId,sourceType:sType,notes,isRedemption:isRed});
    toast('記錄已更新','success');
  } else {
    DB.transactions.push({id:uid(),date,amount,desc,category:catId,sourceId:sId,sourceType:sType,notes,isFixed:false,isRedemption:isRed});
    const cat=getCat(catId);
    if(cat.budget>0&&amount<0&&catMonthSpend(catId)>cat.budget)toast('⚠ 類別「'+cat.name+'」已超過本月額度！','danger');
    else toast('記錄新增成功','success');
  }
  saveDB();closeModal();renderTxns();
}
function doPayment() {
  const cardId=v('pyCardId'),amt=+v('pyAmt'),fromVal=v('pyFrom'),date=v('pyDate'),notes=v('pyNotes');
  if(!amt||!fromVal){toast('請填寫完整資訊','danger');return;}
  const [,fromId]=fromVal.split('_');
  const card=getCard(cardId);
  const lastCat=DB.categories[DB.categories.length-1]?.id||'';
  DB.transactions.push({id:uid(),date,amount:-Math.abs(amt),desc:'信用卡繳款 — '+(card?.name||''),category:lastCat,sourceId:fromId,sourceType:'account',notes,isPayment:true});
  DB.transactions.push({id:uid(),date,amount:+Math.abs(amt),desc:'繳款入帳 — '+(card?.name||''),category:lastCat,sourceId:cardId,sourceType:'card',notes,isPayment:true});
  saveDB();closeModal();renderCards();toast('繳款成功！','success');
}
function doTransfer() {
  const fromId=v('tfFrom'),toId=v('tfTo'),amt=+v('tfAmt'),date=v('tfDate'),notes=v('tfNotes');
  if(!fromId||!toId||!amt){toast('請填寫完整資訊','danger');return;}
  if(fromId===toId){toast('不能轉帳到相同帳戶','danger');return;}
  const from=getAcc(fromId),to=getAcc(toId);
  const lastCat=DB.categories[DB.categories.length-1]?.id||'';
  DB.transactions.push({id:uid(),date,amount:-Math.abs(amt),desc:'轉帳 → '+(to?.name||''),category:lastCat,sourceId:fromId,sourceType:'account',notes,isTransfer:true});
  DB.transactions.push({id:uid(),date,amount:+Math.abs(amt),desc:'轉入 ← '+(from?.name||''),category:lastCat,sourceId:toId,sourceType:'account',notes,isTransfer:true});
  saveDB();closeModal();renderAccounts();toast('轉帳成功！','success');
}
function saveFixed() {
  const day=+v('feDay'),amt=+v('feAmt'),desc=document.getElementById('feDesc').value.trim(),
        catId=v('feCat'),srcVal=v('feSrc'),notes=v('feNotes');
  if(!day||!amt||!desc||!srcVal){toast('請填寫完整資訊','danger');return;}
  const [sType,sId]=srcVal.split('_');
  const obj={day,amount:amt,desc,category:catId,sourceId:sId,sourceType:sType,notes};
  if(modalType==='editFixed'){Object.assign(DB.fixedExpenses.find(f=>f.id===editTarget),obj);toast('固定消費已更新','success');}
  else{DB.fixedExpenses.push({id:uid(),...obj});toast('固定消費新增成功','success');}
  saveDB();closeModal();renderFixed();
}
function saveCat() {
  const name=document.getElementById('catN').value.trim(),budget=+v('catB')||0,color=v('catC');
  const icon=(document.getElementById('catIcon')?.value)||'';
  const emoji=(document.getElementById('catEmoji')?.value||'').trim();
  if(!name){toast('請填入類別名稱','danger');return;}
  const obj={name,budget,color,icon,emoji};
  if(modalType==='editCat'){Object.assign(DB.categories.find(c=>c.id===editTarget),obj);toast('類別已更新','success');}
  else{DB.categories.push({id:uid(),...obj});toast('類別新增成功','success');}
  saveDB();closeModal();renderSettings();
}

// ════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════
function toast(msg,type) {
  const icons={success:'✅',danger:'❌',info:'ℹ️'};
  const el=document.createElement('div');
  el.className='toast '+(type||'info');
  el.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toastWrap').prepend(el);
  setTimeout(()=>el.remove(),3500);
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
function init() {
  autoTheme();
  setInterval(autoTheme, 60000); // re-check every minute

  const now=new Date();
  document.getElementById('navMonth').textContent=
    now.getFullYear()+' / '+String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('menuToggle').onclick=()=>
    document.getElementById('sidebar').classList.toggle('open');

  const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('filterFrom').value=y+'-'+m+'-01';
  document.getElementById('filterTo').value=today();

  generateFixed();
  renderDashboard();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
